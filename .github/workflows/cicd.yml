name: LLMOps CI/CD

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  setup:
    name: "1 · Setup"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job 1 Setup Succeeded"
  
  install:
    name: "2 · Install"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job 2 Install Succeeded"

  lint:
    name: "3 · Lint"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job 3 Lint Succeeded"

  test:
