name: LLMOps CI/CD

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  setup:
    name: "1 · Setup"
    runs-on: ubuntu-latest
    steps:
      - run: echo "Setup Succeeded"
  
  install:
    name: "2 · Install"
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - run: echo "Install Succeeded"

  lint:
    name: "3 · Lint"
    needs: install
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lint Succeeded"

  test:
    name: "4 · Test"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test Succeeded"

  docker-build:
    name: "5 · Docker Build"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker Build Succeeded"

  docker-push:
    name: "6 · Docker Push"
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker Push Succeeded"

  deploy-docker:
    name: "7 · Deploy"
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy Succeeded"

  evaluate:
    name: "8 · LLM Evaluate"
    needs: deploy-docker
    runs-on: ubuntu-latest
    steps:
      - run: echo "Evaluate Succeeded"

  deploy-minikube:
    name: "9 · Deploy Minikube"
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy Minikube Succeeded"
